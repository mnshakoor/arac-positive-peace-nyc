{%- assign share_url = page.url | absolute_url | url_encode -%}
{%- assign share_title = page.title | url_encode -%}
<div class="share-bar">
  <span class="label">Share</span>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener">Facebook</a>
  <a href="https://x.com/intent/post?url={{ share_url }}&amp;text={{ share_title }}" target="_blank" rel="noopener">X</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" target="_blank" rel="noopener">LinkedIn</a>
  <a href="https://wa.me/?text={{ share_title }}%20{{ share_url }}" target="_blank" rel="noopener">WhatsApp</a>
  <a href="mailto:?subject={{ share_title }}&amp;body={{ share_url }}">Email</a>
  <button type="button" onclick="var b=this,u='{{ page.url | absolute_url }}';if(navigator.share){navigator.share({title:document.title,url:u}).catch(function(){});}else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){b.textContent='Link copied';setTimeout(function(){b.textContent='Copy link'},2000);});}">Copy link</button>
</div>
